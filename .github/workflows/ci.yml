name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub and Nexus
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and extract changelog
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$REF_TYPE" == 'tag' ]; then
            if [[ "$RELEASE_TAG" != v* ]]; then
              echo 'Select a stable version tag.' >&2
              exit 1
            fi
            python scripts/release.py metadata --tag "$RELEASE_TAG"
          elif [ "$MANUAL_PUBLISH" == 'true' ]; then
            echo 'Publishing requires a version tag.' >&2
            exit 1
          else
            python scripts/release.py metadata
          fi
      - name: Build using NuGet references
        run: dotnet build ConfigurableQuestsLimit.csproj --configuration Release -p:DeployToGame=false
      - name: Package mod
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Serialise all Nexus uploads, including different version tags.
    concurrency:
      group: nexus-release
      cancel-in-progress: false
      queue: max
    steps:
      - name: Prevent duplicate Nexus uploads on reruns
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != '1' ]; then
            echo 'Check Nexus before retrying. Start a fresh manual run only if this version was not uploaded.' >&2
            exit 1
          fi
      - name: Check Nexus configuration
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
        run: |
          if [ -z "$NEXUS_API_KEY" ] || [ -z "$NEXUS_FILE_ID" ]; then
            echo 'Set secret NEXUSMODS_API_KEY and variable NEXUSMODS_FILE_ID. See docs/RELEASING.md.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: mod-package
          path: dist
      - name: Read the tagged changelog
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py metadata --tag "$RELEASE_TAG"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ConfigurableQuestsLimit ${{ needs.build.outputs.version }}
          body_path: dist/release-notes.md
          files: dist/ConfigurableQuestsLimit-${{ needs.build.outputs.version }}.zip
          fail_on_unmatched_files: true
      - name: Resolve Nexus global mod ID
        id: nexus
        shell: python
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          import json
          import os
          from urllib.request import Request, urlopen
          request = Request('https://api.nexusmods.com/v3/games/atlyss/mods/41', headers={
              'apikey': os.environ['NEXUS_API_KEY'],
              'User-Agent': 'ConfigurableQuestsLimit-release',
          })
          with urlopen(request, timeout=30) as response:
              mod_id = int(json.load(response)['data']['id'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'mod_id={mod_id}\n')
      - name: Upload ZIP and changelog to Nexus
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ steps.nexus.outputs.mod_id }}
          filename: dist/ConfigurableQuestsLimit-${{ needs.build.outputs.version }}.zip
          version: ${{ needs.build.outputs.version }}
          display_name: ConfigurableQuestsLimit ${{ needs.build.outputs.version }}
          description: ${{ steps.notes.outputs.changelog }}
          changelog: ${{ steps.notes.outputs.changelog }}
          category: main
          archive_existing_version: 'true'
          update_mod_version: 'true'
